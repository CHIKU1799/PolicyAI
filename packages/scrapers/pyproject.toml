[project]
name = "policyai-scrapers"
version = "0.1.0"
description = "Scrapers for RBI and SEBI circulars (Playwright)"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.47",
    "httpx>=0.27",
    "pypdf>=5.0",
    "pydantic>=2.8",
    "policyai-graph",
    "policyai-extraction",
    # OCR fallback for scanned regulator PDFs (NPCI, DGFT): pure-pip, no system
    # packages. rapidocr ships detection+recognition ONNX models; pypdfium2
    # rasterizes PDF pages without poppler. cv2 comes via the headless build
    # (see the override in the root pyproject) so the Docker image needs no libGL.
    "rapidocr-onnxruntime>=1.3",
    "pypdfium2>=4.30",
    "opencv-python-headless>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policyai_scrapers"]
